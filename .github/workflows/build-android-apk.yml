name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Loki-Agent-Android-v*.zip'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack source and build APK
        run: |
          unzip -q Loki-Agent-Android-v0.3.0.zip -d build-src
          gradle --no-daemon --stacktrace -p build-src/LokiAgent assembleDebug

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loki-Agent-debug-APK
          path: build-src/LokiAgent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
